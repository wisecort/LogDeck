<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26174f"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf5d2"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fa0"/>
      <stop offset="1" stop-color="#ff3d5e"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- volume histogram -->
  <g>
    <rect x="232" y="560" width="56" height="170" rx="16" fill="url(#bar)" opacity="0.85"/>
    <rect x="312" y="500" width="56" height="230" rx="16" fill="url(#bar)" opacity="0.85"/>
    <rect x="392" y="590" width="56" height="140" rx="16" fill="url(#bar)" opacity="0.85"/>
    <rect x="472" y="380" width="56" height="350" rx="16" fill="url(#hot)" filter="url(#neon)" opacity="0.7"/>
    <rect x="472" y="380" width="56" height="350" rx="16" fill="url(#hot)"/>
    <rect x="552" y="520" width="56" height="210" rx="16" fill="url(#bar)" opacity="0.85"/>
    <rect x="632" y="470" width="56" height="260" rx="16" fill="url(#bar)" opacity="0.85"/>
    <rect x="712" y="570" width="56" height="160" rx="16" fill="url(#bar)" opacity="0.85"/>
  </g>
  <!-- live pulse line -->
  <polyline points="210,330 380,330 430,250 480,420 530,290 570,330 814,330" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" opacity="0.5"/>
  <polyline points="210,330 380,330 430,250 480,420 530,290 570,330 814,330" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="814" cy="330" r="22" fill="#7cf5d2"/>
</svg>
