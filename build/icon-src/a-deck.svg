<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f8f"/>
      <stop offset="0.55" stop-color="#141d45"/>
      <stop offset="1" stop-color="#080c20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#6d97ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6d97ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
  </defs>
  <!-- Apple grid: 824×824 body on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- deck: two cards peeking behind -->
  <rect x="214" y="176" width="596" height="560" rx="56" fill="#3a4fa0" opacity="0.55" transform="rotate(-8 512 456)"/>
  <rect x="200" y="206" width="610" height="570" rx="56" fill="#2a3a80" opacity="0.85" transform="rotate(-3.5 505 491)"/>
  <!-- front card -->
  <rect x="182" y="250" width="660" height="600" rx="60" fill="#000" opacity="0.35" transform="translate(0 18)"/>
  <rect x="182" y="250" width="660" height="600" rx="60" fill="url(#card)" stroke="#7d96ff" stroke-opacity="0.45" stroke-width="5"/>
  <!-- window dots -->
  <circle cx="246" cy="314" r="16" fill="#ff6b6b"/>
  <circle cx="296" cy="314" r="16" fill="#f2c14e"/>
  <circle cx="346" cy="314" r="16" fill="#3fd99a"/>
  <!-- log lines: bigger dots and bars -->
  <g stroke-linecap="round">
    <circle cx="258" cy="410" r="20" fill="#3fd9b8"/><line x1="310" y1="410" x2="700" y2="410" stroke="#93a6dc" stroke-opacity="0.85" stroke-width="34"/>
    <circle cx="258" cy="500" r="20" fill="#f2c14e"/><line x1="310" y1="500" x2="770" y2="500" stroke="#93a6dc" stroke-opacity="0.85" stroke-width="34"/>
    <!-- the error line, highlighted -->
    <rect x="206" y="548" width="612" height="104" rx="28" fill="#ff5d73" opacity="0.2"/>
    <circle cx="258" cy="600" r="22" fill="#ff5d73"/><line x1="310" y1="600" x2="752" y2="600" stroke="#ffb7c1" stroke-width="36"/>
    <circle cx="258" cy="700" r="20" fill="#3fd9b8"/><line x1="310" y1="700" x2="640" y2="700" stroke="#93a6dc" stroke-opacity="0.85" stroke-width="34"/>
    <circle cx="258" cy="786" r="20" fill="#3fd9b8"/><line x1="310" y1="786" x2="560" y2="786" stroke="#93a6dc" stroke-opacity="0.5" stroke-width="34"/>
  </g>
</svg>
