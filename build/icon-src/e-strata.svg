<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Concept E, "Strata": an isometric deck of three layers (context, namespace, pod);
       the top layer carries the log lines and the bottom one glows red where the error lives. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a2e"/>
      <stop offset="1" stop-color="#090b16"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#5a5cf0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a9a"/>
      <stop offset="1" stop-color="#2a2f72"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#c2335a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#ff5d73" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5d73" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- bottom layer (error) -->
  <polygon points="512,560 790,680 512,800 234,680" fill="#7a1f38"/>
  <polygon points="512,530 790,650 512,770 234,650" fill="url(#low)"/>
  <!-- middle layer -->
  <polygon points="512,440 790,560 512,680 234,560" fill="#151a40"/>
  <polygon points="512,410 790,530 512,650 234,530" fill="url(#mid)"/>
  <!-- top layer with log lines -->
  <polygon points="512,320 790,440 512,560 234,440" fill="#20286a"/>
  <polygon points="512,290 790,410 512,530 234,410" fill="url(#top)"/>
  <!-- log lines drawn in the top face's isometric plane -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="20">
    <line x1="477" y1="335" x2="630" y2="401" stroke-opacity="0.95"/>
    <line x1="408" y1="365" x2="588" y2="443" stroke-opacity="0.75"/>
    <line x1="338" y1="395" x2="456" y2="446" stroke-opacity="0.55"/>
  </g>
</svg>
