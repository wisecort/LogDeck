repos:
  - repo: local
    hooks:
      - id: logdeck-guardrails
        name: LogDeck guardrails (G1–G10)
        entry: node scripts/guardrails.mjs
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
