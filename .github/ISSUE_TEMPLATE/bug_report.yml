name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste real cluster data**: no kubeconfig, tokens, real logs or internal hostnames/IPs. Use fictional values (`10.0.0.x`, `example.internal`).
        Security problem? Do not open an issue, see [SECURITY.md](https://github.com/wisecort/LogDeck/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pod with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogDeck version
      description: Shown in Preferences → About.
      placeholder: "1.6.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux (.deb)
        - Linux (.rpm)
        - Linux (AppImage)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - Microsoft Store
        - winget
        - Download from GitHub Releases
        - Built from source
  - type: input
    id: kubectl
    attributes:
      label: kubectl version and cluster type
      description: Output of `kubectl version --client`, and the cluster (EKS, GKE, AKS, kind, OpenShift…).
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or fictional log sample
      description: Optional. Anonymize anything you paste.
