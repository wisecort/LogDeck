name: release

# Builds the installers for every OS when a version tag is pushed and attaches them to the GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: release:mac
            files: release/*.dmg release/*.zip
          - os: ubuntu-latest
            script: release:linux
            files: release/*.AppImage release/*.deb release/*.rpm
          - os: windows-latest
            script: release:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Linux deps for .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # ad-hoc signing (no secrets): sign in pull requests too, so CI checks what the release ships
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Checksums
        run: |
          cd release
          files=$(cd .. && ls ${{ matrix.files }} | xargs -n1 basename)
          if command -v sha256sum >/dev/null; then sha256sum $files; else shasum -a 256 $files; fi > "SHA256SUMS-${{ runner.os }}.txt"
          cat "SHA256SUMS-${{ runner.os }}.txt"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" "${{ github.repository }}" > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LogDeck ${TAG#v}" --notes-file release-notes.md || true
          gh release upload "$TAG" ${{ matrix.files }} "release/SHA256SUMS-${{ runner.os }}.txt" --clobber

  # Opens the "Update: wisecort.LogDeck to X.Y.Z" PR in microsoft/winget-pkgs once the Windows
  # installer and its checksum are in the release. Needs the WINGET_TOKEN secret (classic PAT with
  # public_repo, from the owner of the wisecort/winget-pkgs fork); without it the job only leaves a notice.
  winget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: No token
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN não configurado; rode 'make winget VERSION=${GITHUB_REF_NAME#v}' localmente"
      - name: Open the winget-pkgs PR
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: bash scripts/update-winget.sh "${GITHUB_REF_NAME#v}"
