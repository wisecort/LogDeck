name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Harness
        run: make harness
        env:
          HARNESS_REQUIRE_GITLEAKS: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
