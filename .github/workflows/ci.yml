name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gitleaks (macOS)
        if: runner.os == 'macOS'
        run: brew install gitleaks

      - name: Linux deps for Electron E2E (xvfb, user namespaces for the Chromium sandbox)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Harness
        run: bash scripts/harness.sh
        env:
          # gitleaks is required on macOS; Linux/Windows warn and skip (same history, scanned once).
          HARNESS_REQUIRE_GITLEAKS: ${{ runner.os == 'macOS' && '1' || '0' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # ad-hoc signing (no secrets): sign in pull requests too, so CI checks what the release ships
          CSC_FOR_PULL_REQUEST: 'true'

      # The Microsoft Store package: built on every PR so CI checks what goes to the Store, and kept
      # as a workflow artifact for manual testing (not attached to releases: the Store signs it on submission).
      - name: Microsoft Store package (appx)
        if: runner.os == 'Windows'
        run: npm run release:store

      - name: Keep the Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LogDeck-store-appx
          path: release/*.appx
          if-no-files-found: error
          retention-days: 14
